
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notre bibliothèque familiale</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <header>
    <div class="container">
      <p class="eyebrow">BIBLIOTHÈQUE FAMILIALE</p>
      <h1>Nos lectures</h1>
      <p>Les livres que nous avons lus, aimés et découverts.</p>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <h2>Ajouter un livre</h2>
      <form id="book-form">
        <div class="form-grid">
          <label>
            Lecteur
            <select id="lecteur" required>
              <option value="">Choisir un lecteur</option>
              <option>François-Xavier</option>
              <option>Hélène</option>
              <option>Albertine</option>
              <option>Gabriel</option>
              <option>Léopold</option>
              <option>Théophile</option>
            </select>
          </label>

          <label>
            Titre
            <input id="titre" type="text" maxlength="300"
                   placeholder="Titre du livre" required>
          </label>

          <label>
            Auteur
            <input id="auteur" type="text" maxlength="200"
                   placeholder="Nom de l'auteur" required>
          </label>

          <label>
            Date de lecture
            <input id="date_lecture" type="date" required>
          </label>
        </div>

        <button id="submit-button" type="submit">
          Ajouter à la bibliothèque
        </button>
        <p id="form-message" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="panel">
      <div class="section-heading">
        <h2>Les livres lus</h2>
        <span id="book-count"></span>
      </div>

      <div class="filters">
        <label>
          Rechercher
          <input id="search" type="search"
                 placeholder="Titre ou auteur">
        </label>

        <label>
          Filtrer par lecteur
          <select id="filter-reader">
            <option value="">Tous les lecteurs</option>
            <option>François-Xavier</option>
            <option>Hélène</option>
            <option>Albertine</option>
            <option>Gabriel</option>
            <option>Léopold</option>
            <option>Théophile</option>
          </select>
        </label>
      </div>

      <p id="list-message" role="status" aria-live="polite"></p>
      <div id="book-list" class="book-list"></div>

      <div class="pagination">
        <button id="previous" type="button">Précédent</button>
        <span id="page-info"></span>
        <button id="next" type="button">Suivant</button>
      </div>
    </section>
  </main>

  <footer>Notre bibliothèque familiale</footer>
</body>
</html>
